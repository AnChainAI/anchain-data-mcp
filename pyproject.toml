[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchain_data_mcp"
version = "0.1.0"
description = "mcp server for AnChain data api"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.6",
    "requests>=2.32.4",
]

[project.scripts]
anchain_data = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
